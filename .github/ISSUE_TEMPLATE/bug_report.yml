name: Bug report
description: Something in Ember doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a new chat\n2. ..."
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16 Pro, iOS 26.5
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Chat, Memory, Files and notes, Calendar and reminders, Lock screen, Onboarding, Agents (Beta), Web search (Beta), Other]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal information from anything I pasted here
          required: true
